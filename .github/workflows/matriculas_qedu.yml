name: Matriculas (INEP + QEdu)

# Matricula por escola. Fonte principal agora: microdados oficiais do Censo Escolar (INEP), pois o QEdu bloqueia o GitHub Actions (HTTP 403).
# Matriculas ja conferidas no QEdu NAO sao alteradas. O script so grava se a coluna do INEP reproduzir o numero do QEdu (teste de equivalencia).
# Sem escola pendente, termina em segundos e nao faz commit.
on:
  schedule:
    - cron: '17 5 * * *'     # 2h17 em Brasilia
  workflow_dispatch:
    inputs:
      url_zip:
        description: 'OPCIONAL: link direto do .zip dos microdados do Censo Escolar (so se o download automatico falhar)'
        default: ''
      ano_censo:
        description: 'Ano do Censo Escolar'
        default: '2025'

permissions:
  contents: write

# Mesmo grupo do "Atualizar dados": os dois nunca rodam ao mesmo tempo.
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  matriculas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Atualizar lista de escolas
        run: python scripts/gerar_json.py

      - name: Buscar matriculas no INEP (Censo Escolar)
        env:
          INEP_ZIP_URL: ${{ github.event.inputs.url_zip }}
          ANO_CENSO: ${{ github.event.inputs.ano_censo || '2025' }}
        run: python scripts/matriculas_inep.py

      - name: Recalcular impacto social
        if: always()
        run: python scripts/gerar_json.py

      - name: Salvar no repositorio
        if: always()
        run: |
          git config user.name "bot-dados"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Matriculas INEP $(date -u +%F)"
          git pull --rebase origin main
          git push
