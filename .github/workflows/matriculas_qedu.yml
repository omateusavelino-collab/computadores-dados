name: Matriculas QEdu

# Consulta no QEdu (fonte definida pela area gestora) as matriculas das escolas da LISTA_ESCOLAS.
# VERSAO CONSERVADORA: 1 escola por vez. Em bloqueio temporario, para sem perder a fila.
# Cada escola e consultada uma vez e revisada 1x por ano. Sem escola na fila, termina em segundos e nao faz commit.
on:
  schedule:
    - cron: '17 5 * * *'     # 2h17 em Brasilia
  workflow_dispatch:
    inputs:
      limite:
        description: 'Quantas escolas consultar nesta execucao'
        default: '250'
      paralelo:
        description: 'Quantas escolas ao mesmo tempo. Recomendado: 1.'
        default: '1'

permissions:
  contents: write

# Mesmo grupo do "Atualizar dados": os dois nunca rodam ao mesmo tempo.
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  matriculas:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt playwright

      - name: Atualizar lista de escolas a consultar
        run: python scripts/gerar_json.py

      - name: Ha escola na fila?
        id: fila
        run: python scripts/buscar_matriculas_qedu.py --contar

      - name: Instalar navegador
        if: steps.fila.outputs.pendentes != '0'
        run: python -m playwright install --with-deps chromium

      - name: Consultar QEdu
        if: steps.fila.outputs.pendentes != '0'
        env:
          LIMITE: ${{ github.event.inputs.limite || '250' }}
          PARALELO: ${{ github.event.inputs.paralelo || '1' }}
          ESPERA_MAX: '10'
          TEMPO_MAX_MIN: '140'
        run: python scripts/buscar_matriculas_qedu.py

      - name: Recalcular impacto social
        if: ${{ always() && steps.fila.outcome == 'success' && steps.fila.outputs.pendentes != '0' }}
        run: python scripts/gerar_json.py

      - name: Salvar no repositorio
        if: ${{ always() && steps.fila.outcome == 'success' && steps.fila.outputs.pendentes != '0' }}
        run: |
          git config user.name "bot-dados"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Matriculas QEdu $(date -u +%F)"
          git pull --rebase origin main
          git push
